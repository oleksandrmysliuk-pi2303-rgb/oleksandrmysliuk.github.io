<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автозапчастини — магазин</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="logo">🚗 АвтоЗапчастини</div>
    <!-- Іконка корзини у верхньому правому куті + кількість найменувань -->
    <button id="cart-button" class="cart-button" type="button" aria-label="Корзина">
      <span class="cart-icon">🛒</span>
      <span id="cart-count" class="cart-count">0</span>
    </button>
  </header>

  <main class="page">
    <h1 class="page-title">Оберіть запчастини для свого авто</h1>
    <div id="products" class="products"></div>
  </main>
<script src="js/script.js " defer></script>
<script src="js/index.js" defer></script>
</body>
</html>
