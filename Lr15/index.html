<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lr 4</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h1>Індивідуальний проєкт</h1>
    <p class="hint">Результати виводяться на сторінку і дублюються в консоль (F12).</p>

    <div class="task">
        <h3>1. Об'єкт stamp</h3>
        <button id="btnS1">Показати властивості марки</button>
        <div class="output" id="outS1"></div>
    </div>

    <div class="task">
        <h3>2. Масив collection</h3>
        <button id="btnS2Show">Показати колекцію</button>
        <button id="btnS2Push">Додати нову марку та показати колекцію</button>
        <div class="output" id="outS2"></div>
    </div>

    <div class="task">
        <h3>3. Методи масивів</h3>
        <button id="btnS3Sort">Сортувати за роком (зростання)</button>
        <button id="btnS3Filter">Показати необміняні марки</button>
        <button id="btnS3Find">Знайти марку за країною</button>
        <div class="output" id="outS3"></div>
    </div>

    <div class="task">
        <h3>4. Взаємодія з користувачем</h3>
        <button id="btnS4">Додати марку через форму</button>
        <div class="output" id="outS4"></div>
    </div>

    <div class="task">
        <h3>Додаткові функції</h3>
        <button id="btnSMark">Позначити марку як обміняну</button>
        <button id="btnSAvg">Обчислити середній рік випуску</button>
        <div class="output" id="outSExtra"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
