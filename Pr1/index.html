<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Pr1</title>
</head>
<body>
    <h1>Практична робота<br><small>Методи масивів — завдання 1-4</small></h1>
 
<!-- ===================== ЗАВДАННЯ 1 ===================== -->
<h2>Завдання 1. Фільтрація та пошук (filter, find)</h2>
 
<div class="task">
  <button id="btnAvailable">Товари в наявності</button>
  <button id="btnFindProduct">Знайти товар за назвою</button>
  <div class="output" id="out1"></div>
</div>
 
<!-- ===================== ЗАВДАННЯ 2 ===================== -->
<h2>Завдання 2. Групування та сортування (reduce, push, sort)</h2>
 
<div class="task">
  <button id="btnGroup">Групувати студентів за групами</button>
  <button id="btnSortGrade">Сортувати за оцінкою (спадання)</button>
  <div class="output" id="out2"></div>
</div>
 
<!-- ===================== ЗАВДАННЯ 3 ===================== -->
<h2>Завдання 3. Статистичний аналіз даних (reduce)</h2>
 
<div class="task">
  <button id="btnAvgSalary">Середня зарплата</button>
  <button id="btnMostExp">Найдосвідченіший працівник</button>
  <div class="output" id="out3"></div>
</div>
 
<!-- ===================== ЗАВДАННЯ 4 ===================== -->
<h2>Завдання 4. Обробка даних про книги (reduce, sort)</h2>
 
<div class="task">
  <button id="btnUnread">Непрочитані книги</button>
  <button id="btnByAuthor">Книги за автором</button>
  <button id="btnTopRated">Книги з рейтингом вище 4</button>
  <div class="output" id="out4"></div>
</div>
<script src="js/script.js"></script>
</body>
</html>
